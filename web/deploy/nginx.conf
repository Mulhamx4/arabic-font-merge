# Same policy as deploy/headers, for a self-hosted nginx.
#
# `connect-src` here still allows the jsDelivr CDN because that is where Pyodide
# and its packages come from. To reach `connect-src 'self'` -- the strongest
# version of the privacy claim -- mirror the Pyodide distribution under
# /pyodide/ on this origin and change PYODIDE_URL in worker.js to match, then
# drop cdn.jsdelivr.net from both directives below.

server {
    root /var/www/fonttool;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' blob: data:; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
