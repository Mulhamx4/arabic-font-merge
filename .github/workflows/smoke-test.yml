name: smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate the currency manifest
        run: python tests/check_manifest.py

      # No font is committed to this repository (see NOTICE.md), and downloading
      # one would make CI depend on somebody else's uptime, so we generate them:
      # a two-weight static family, and a variable font carrying the fvar, gvar
      # and HVAR that the advance-inheritance check needs. Both land where the
      # non-recursive scans below will not mistake one for the other.
      - name: Generate the synthetic test fonts
        run: |
          python tests/make_test_font.py tests/fonts
          python tests/make_variable_test_font.py tests/fonts/variable

      - name: Survey
        run: python scripts/inspect_fonts.py tests/fonts

      - name: Build (collection + standalone + symbols + shortcuts)
        run: python scripts/build_family.py tests/fonts --out build/ --version 1.000

      - name: Verify — exits non-zero on any failure
        run: python scripts/verify_font.py build/SmokeTest.ttc

      - name: Build again as a Windows .ttc and re-verify
        run: |
          python scripts/build_family.py tests/fonts --out build-ttc/ \
            --version 1.001 --format ttc --woff2
          python scripts/verify_font.py build-ttc/SmokeTest.ttc

      - name: Proof page (HTML only; no browser in CI)
        run: python scripts/make_proof.py build/SmokeTest.ttc --out build/ --no-png

      # The browser tool in web/ loads scripts/ and assets/ directly, so a change
      # to either can break it. Everything below is headless and, like the rest
      # of this workflow, downloads nothing: the fixtures are derived from the
      # synthetic fonts built above. What still needs real fonts is the richer
      # corpora -- Arabic coverage, CFF outlines, an italic without Arabic --
      # and those tests name what they skipped rather than pretending to have
      # run.
      - name: Web tool — theme contrast, i18n hygiene, JavaScript syntax
        run: |
          node tests/test_contrast.js
          node tests/check_js.mjs

      - name: Documentation — every relative link and anchor resolves
        run: python tests/check_docs.py

      - name: Web tool — engine, licence rules, Arabic names, custom currency
        run: |
          python tests/run_engine.py all
          python tests/test_license_rules.py
          python tests/test_arabic_names.py
          python tests/test_custom_currency.py
          python tests/test_variable_advance.py

      - name: Web tool — parity with the command-line build
        run: python tests/test_parity.py tests/fonts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-py${{ matrix.python }}
          path: |
            build/
            build-ttc/
          retention-days: 7
